<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to My Interactive Web Page!</h1>

        <button id="changeTextBtn">Click me!</button>

        <div class="gallery">
            <img id="galleryImage" src="kong2.png" alt="Gallery Image">
            <!-- <img id="galleryImage" src="sabu.jpg" alt="Gallery Image ">
            <img id="galleryImage" src="sabu1.jpg" alt="Gallery Image "> -->
            <button id="nextImageBtn">Next Image</button>
        </div>

        <form id="contactForm">
            <input type="email" id="email" placeholder="Enter your email" required>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
